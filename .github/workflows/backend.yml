name: Backend CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Static code analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pylint
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pylint backend/*.py

  deploy:
    name: Upload function package to GCS
    runs-on: ubuntu-latest
    needs: test
    # The GCP project has been decommissioned: deployment runs only when started manually.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare function package
        run: |
          cd backend
          zip -r main.zip . -x '*.zip'
          file_name="main_$(md5sum main.zip | awk '{print $1}').zip"
          echo "file_name=${file_name}" >> "$GITHUB_ENV"
          mv main.zip "${file_name}"

      - name: Upload to GCS
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "${GCP_CREDENTIALS}" | gcloud auth activate-service-account --key-file=-
          gsutil cp "backend/${{ env.file_name }}" gs://cloudcv_function_vulcu
